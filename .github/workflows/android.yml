name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/generate_android_model_catalog.py"
      - "scripts/android_model_catalog_overrides.json"
      - "src-tauri/src/catalog/catalog.json"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/generate_android_model_catalog.py"
      - "scripts/android_model_catalog_overrides.json"
      - "src-tauri/src/catalog/catalog.json"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check material3 stable status (Expressive migration gate)
        run: |
          python3 scripts/check_material3_stable.py
          python3 scripts/check_material3_stable.py --selftest

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
          sudo ln -sf $ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2 /usr/bin/aapt2

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads the android-all jars (~130 MB) from Maven Central into
      # ~/.m2/repository at test runtime; the Gradle cache above does not cover it, so
      # without this every run re-downloads them. Keyed on app/build.gradle.kts, where
      # the pinned Robolectric/Conscrypt versions live.
      - name: Cache Robolectric android-all jars (~/.m2)
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-m2-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            robolectric-m2-${{ runner.os }}-

      - name: Validate Android project
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: handy-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
